<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Finexy — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --brand:#E8441A;--bg:#0C0D0F;--surface:#141518;--surface2:#1C1E22;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
  --t1:#F5F5F7;--t2:#8A8F9E;--t3:#4A4F5E;--r:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;display:flex;align-items:center;justify-content:center;}
input,button{font-family:'DM Sans',sans-serif;outline:none}

.wrap{width:100%;max-width:440px;padding:24px 16px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 36px;box-shadow:0 24px 64px rgba(0,0,0,.45);animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Logo */
.logo{display:flex;align-items:center;gap:11px;margin-bottom:28px;justify-content:center;}
.logo-icon{width:40px;height:40px;background:var(--brand);border-radius:11px;display:grid;place-items:center;box-shadow:0 0 24px rgba(232,68,26,.4);flex-shrink:0;}
.logo-text{font-family:'Syne',sans-serif;font-size:1.45rem;font-weight:800;letter-spacing:-.03em;}

/* Heading */
.heading{text-align:center;margin-bottom:28px;}
.heading h2{font-family:'Syne',sans-serif;font-size:1.45rem;font-weight:800;letter-spacing:-.03em;margin-bottom:6px;}
.heading p{font-size:.81rem;color:var(--t2);line-height:1.55;}

/* Fields */
.fg{margin-bottom:14px;}
.fg label{display:block;font-size:.67rem;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;}
.fw{position:relative;display:flex;align-items:center;}
.fw svg.fi{position:absolute;left:13px;width:15px;height:15px;stroke:var(--t3);fill:none;stroke-width:1.8;stroke-linecap:round;pointer-events:none;transition:stroke .15s;}
.fw:focus-within svg.fi{stroke:var(--brand);}
.fw input{width:100%;height:46px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r);padding:0 42px 0 40px;font-size:.88rem;color:var(--t1);transition:border-color .15s,box-shadow .15s;}
.fw input::placeholder{color:var(--t3);}
.fw input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(232,68,26,.12);}
.tpw{position:absolute;right:12px;background:none;border:none;cursor:pointer;color:var(--t3);padding:4px;transition:color .15s;}
.tpw:hover{color:var(--t1);}
.tpw svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;display:block;}

/* Code hint */
.code-hint{margin-top:5px;font-size:.7rem;color:var(--t3);line-height:1.5;padding:7px 11px;background:rgba(255,255,255,.03);border-radius:8px;border:1px solid var(--border);}

/* MSG */
.fmsg{padding:11px 14px;border-radius:var(--r);font-size:.79rem;font-weight:500;margin-bottom:14px;display:none;align-items:center;gap:9px;line-height:1.45;}
.fmsg.show{display:flex;}
.fmsg.error  {background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);color:#FCA5A5;}
.fmsg.success{background:rgba(34,197,94,.1); border:1px solid rgba(34,197,94,.25); color:#86EFAC;}
.fmsg svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0;}

/* Role badge — shown after successful identification */
.role-banner{display:none;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r);margin-bottom:14px;font-size:.8rem;font-weight:600;}
.role-banner.show{display:flex;}

/* Submit */
.bsub{width:100%;height:47px;border:none;border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:.92rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:all .18s;color:#fff;background:var(--brand);box-shadow:0 4px 18px rgba(232,68,26,.3);margin-top:4px;}
.bsub:hover{transform:translateY(-1px);filter:brightness(1.08);}
.bsub.loading{pointer-events:none;opacity:.8;}
.spin{display:none;width:17px;height:17px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
.bsub.loading .spin{display:block;}
.bsub.loading .bl{display:none;}
@keyframes spin{to{transform:rotate(360deg)}}

/* Footer */
.foot{text-align:center;margin-top:20px;font-size:.72rem;color:var(--t3);}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;padding:10px 16px;border-radius:10px;font-size:.79rem;font-weight:500;opacity:0;transform:translateY(8px);transition:opacity .24s,transform .24s;pointer-events:none;z-index:9999;}
.toast.show{opacity:1;transform:none;}
.toast.success{background:#166534;color:#86EFAC;border:1px solid rgba(34,197,94,.3);}
.toast.error  {background:#7F1D1D;color:#FCA5A5;border:1px solid rgba(239,68,68,.3);}

@media(max-width:480px){
  .card{padding:28px 18px; border-radius:16px;}
  .heading h2{ font-size:1.2rem; }
  .wrap{ padding:16px 10px; }
  .fw input{ height:42px; font-size:.84rem; }
  .bsub{ height:44px; font-size:.88rem; }
}
@media(max-width:360px){
  .card{padding:22px 14px;}
  .logo-text{ font-size:1.2rem; }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="card">

    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="#fff"/></svg>
      </div>
      <span class="logo-text">Finexy</span>
    </div>

    <!-- Heading -->
    <div class="heading">
      <h2>Welcome back</h2>
      <p>Enter your credentials to access your account.</p>
    </div>

    <!-- Message -->
    <div class="fmsg" id="msg">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="msgT"></span>
    </div>

    <!-- Role banner (shown when role is detected) -->
    <div class="role-banner" id="roleBanner">
      <span id="roleBannerIcon"></span>
      <span id="roleBannerText"></span>
    </div>

    <!-- Email -->
    <div class="fg">
      <label>Email Address</label>
      <div class="fw">
        <svg class="fi" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <input type="email" id="lEmail" placeholder="you@example.com" autocomplete="email"/>
      </div>
    </div>

    <!-- Password -->
    <div class="fg">
      <label>Password</label>
      <div class="fw">
        <svg class="fi" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="lPw" placeholder="Your password" autocomplete="current-password"/>
        <button class="tpw" onclick="tpw('lPw',this)" tabindex="-1">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <!-- Access Code (hidden for admin) -->
    <div class="fg" id="codeWrap" style="display:none;">
      <label>Access Code</label>
      <div class="fw">
        <svg class="fi" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <input type="password" id="lCode" placeholder="e.g. FXY-STF-A3K9P" autocomplete="off"/>
        <button class="tpw" onclick="tpw('lCode',this)" tabindex="-1">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="code-hint">Your access code was provided when your account was created. Contact your Admin or Manager if you don't have it.</div>
    </div>

    <!-- Sign In Button -->
    <button class="bsub" id="lBtn" onclick="doLogin()">
      <span class="bl">Sign In →</span>
      <div class="spin"></div>
    </button>

    <div class="foot">© 2026 Finexy. All rights reserved.</div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════
   SUPABASE
═══════════════════════════════ */
const SUPA_URL = 'https://ymkgqqerdocfcgyphfzs.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlta2dxcWVyZG9jZmNneXBoZnpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0ODA3MzUsImV4cCI6MjA5NTA1NjczNX0.SqwwSpwvsstfumhpTJasSsGMbe0LAm7Z3N-H0U2PoVc';

async function sbQuery(path, options={}) {
  const method  = options.method || 'GET';
  const headers = {
    'apikey':        SUPA_KEY,
    'Authorization': 'Bearer ' + SUPA_KEY,
    'Content-Type':  'application/json',
  };
  if (method === 'POST' || method === 'PATCH') headers['Prefer'] = 'return=representation';
  if (method === 'DELETE') headers['Prefer'] = 'return=minimal';
  const fetchOpts = { method, headers };
  if (options.body) fetchOpts.body = options.body;
  const res = await fetch(SUPA_URL + '/rest/v1/' + path, fetchOpts);
  if (!res.ok) { const e = await res.text(); throw new Error(e); }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : [];
}

/* ═══════════════════════════════
   DEFAULT ADMIN CREDENTIALS
   (never shown on the page)
═══════════════════════════════ */
const DEFAULT_ADMIN_EMAIL    = 'davidlovemathematics@gmil.com';
const DEFAULT_ADMIN_PASSWORD = 'Darasimi@2007';

/* Role display config */
const ROLE_META = {
  admin:   { icon:'👑', label:'Admin',   color:'#E8441A', bg:'rgba(232,68,26,.1)',   border:'rgba(232,68,26,.25)'  },
  manager: { icon:'📊', label:'Manager', color:'#A78BFA', bg:'rgba(124,58,237,.1)',  border:'rgba(124,58,237,.25)' },
  staff:   { icon:'🧑‍💼', label:'Staff',   color:'#7DD3FC', bg:'rgba(2,132,199,.1)',   border:'rgba(2,132,199,.25)'  },
  rider:   { icon:'🛵', label:'Rider',   color:'#6EE7B7', bg:'rgba(5,150,105,.1)',   border:'rgba(5,150,105,.25)'  },
};

/* Redirect if already logged in */
(function(){ if(sessionStorage.getItem('finexy_session')) window.location.replace('index.html'); })();

/* ── Toggle password visibility ── */
function tpw(id, btn) {
  const inp  = document.getElementById(id);
  const show = inp.type === 'password';
  inp.type   = show ? 'text' : 'password';
  btn.innerHTML = show
    ? '<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10 10 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
}
window.tpw = tpw;

function showMsg(msg, type) {
  const e = document.getElementById('msg');
  e.className = 'fmsg show ' + type;
  document.getElementById('msgT').textContent = msg;
}
function clearMsg() { document.getElementById('msg').className = 'fmsg'; }

/* ── Seed default admin into Supabase (background, non-blocking) ── */
async function seedDefaultAdmin() {
  try {
    const existing = await sbQuery('users?email=eq.' + encodeURIComponent(DEFAULT_ADMIN_EMAIL) + '&select=id,password');
    if (existing.length === 0) {
      await sbQuery('users', {
        method: 'POST',
        body: JSON.stringify({
          first:'Admin', last:'Finexy', business:'Finexy',
          email: DEFAULT_ADMIN_EMAIL, password: DEFAULT_ADMIN_PASSWORD,
          role:'admin', approved:true, deactivated:false, access_code:null,
        }),
      });
    }
  } catch(e) { /* non-fatal */ }
}

/* ═══════════════════════════════
   SIGN IN  — single unified flow
═══════════════════════════════ */
async function doLogin() {
  const email = document.getElementById('lEmail').value.trim().toLowerCase();
  const pw    = document.getElementById('lPw').value;
  const code  = document.getElementById('lCode').value.trim();

  clearMsg();

  if (!email) { showMsg('Enter your email address.', 'error'); return; }
  if (!pw)    { showMsg('Enter your password.', 'error'); return; }

  const btn = document.getElementById('lBtn');
  btn.classList.add('loading');

  /* ── 1. Check if this is the default Admin ── */
  if (email === DEFAULT_ADMIN_EMAIL && pw === DEFAULT_ADMIN_PASSWORD) {
    seedDefaultAdmin(); // sync to Supabase in background

    // Try to get Supabase record for a real userId
    let supaUser = null;
    try {
      const rows = await sbQuery('users?email=eq.' + encodeURIComponent(email) + '&select=*');
      supaUser = rows[0] || null;
    } catch(e) { /* offline fallback */ }

    const session = supaUser
      ? mkSession(supaUser)
      : { userId:'admin-default', email: DEFAULT_ADMIN_EMAIL, name:'Admin Finexy', business:'Finexy', role:'admin', initials:'AF' };

    sessionStorage.setItem('finexy_session', JSON.stringify(session));
    btn.classList.remove('loading');
    showRoleBanner('admin');
    showMsg('Welcome back, Admin! Redirecting…', 'success');
    setTimeout(() => window.location.href = 'index.html', 1000);
    return;
  }

  /* ── 2. Look up by email in Supabase ── */
  let user = null;
  try {
    const rows = await sbQuery('users?email=eq.' + encodeURIComponent(email) + '&select=*');
    user = rows[0] || null;
  } catch(e) {
    btn.classList.remove('loading');
    showMsg('Connection error. Please try again.', 'error');
    return;
  }

  // Wrong email
  if (!user) {
    btn.classList.remove('loading');
    showMsg('No account found with that email address.', 'error');
    return;
  }

  // Wrong password
  if (user.password !== pw) {
    btn.classList.remove('loading');
    showMsg('Incorrect password.', 'error');
    return;
  }

  // Account deactivated
  if (user.deactivated) {
    btn.classList.remove('loading');
    showMsg('🚫 Your account has been deactivated. Contact your Admin or Manager.', 'error');
    return;
  }

  // Account not yet approved
  if (!user.approved) {
    btn.classList.remove('loading');
    showMsg('⏳ Your account is pending approval. Contact your Admin or Manager.', 'error');
    return;
  }

  /* ── 3. For non-admin roles, verify the Access Code ── */
  if (user.role !== 'admin') {
    // Show the code field if it's not visible yet
    document.getElementById('codeWrap').style.display = 'block';

    if (!code) {
      btn.classList.remove('loading');
      showMsg('Enter your Access Code to continue.', 'error');
      document.getElementById('lCode').focus();
      showRoleBanner(user.role);
      return;
    }

    if (!user.access_code || user.access_code !== code) {
      btn.classList.remove('loading');
      showMsg('Invalid Access Code. Check the code provided by your Admin or Manager.', 'error');
      return;
    }
  }

  /* ── 4. All checks passed — sign in ── */
  sessionStorage.setItem('finexy_session', JSON.stringify(mkSession(user)));
  btn.classList.remove('loading');
  showRoleBanner(user.role);
  const meta = ROLE_META[user.role] || ROLE_META.staff;
  showMsg('Welcome back, ' + user.first + '! Redirecting…', 'success');
  setTimeout(() => window.location.href = 'index.html', 1000);
}
window.doLogin = doLogin;

/* Show a role badge above the button once the role is known */
function showRoleBanner(role) {
  const meta   = ROLE_META[role] || ROLE_META.staff;
  const banner = document.getElementById('roleBanner');
  banner.style.cssText = `display:flex;background:${meta.bg};border:1px solid ${meta.border};border-radius:var(--r);`;
  document.getElementById('roleBannerIcon').textContent = meta.icon;
  document.getElementById('roleBannerText').innerHTML   = 'Signing in as <strong style="color:' + meta.color + ';margin-left:4px;">' + meta.label + '</strong>';
}

/* Smart: show code field when email loses focus if the user exists and is not admin */
document.getElementById('lEmail').addEventListener('blur', async function() {
  const email = this.value.trim().toLowerCase();
  if (!email || !email.includes('@')) return;
  if (email === DEFAULT_ADMIN_EMAIL) {
    document.getElementById('codeWrap').style.display = 'none';
    return;
  }
  try {
    const rows = await sbQuery('users?email=eq.' + encodeURIComponent(email) + '&select=role,approved,deactivated');
    const u = rows[0];
    if (u && u.role !== 'admin') {
      document.getElementById('codeWrap').style.display = 'block';
    }
  } catch(e) { /* ignore */ }
});

function mkSession(u) {
  return {
    userId:   u.id,
    email:    u.email,
    name:     u.first + ' ' + u.last,
    business: u.business,
    role:     u.role,
    initials: ((u.first?.[0] || '') + (u.last?.[0] || '')).toUpperCase(),
  };
}

/* Enter key submits */
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
